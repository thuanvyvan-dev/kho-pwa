<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Nhật ký kho 资材课</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--pri:#2563eb;--warn:#dc2626;--ok:#16a34a;--nav:62px}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#151b26;--tx:#f1f5f9;--mu:#94a3b8;--bd:#263042}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,pre{-webkit-user-select:text;user-select:text}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;min-height:100dvh}
main{max-width:640px;margin:0 auto;padding:10px 12px calc(var(--nav) + 28px + env(safe-area-inset-bottom))}
h2{font-size:14px;margin:0;min-width:0;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
small,.mu{color:var(--mu);font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1;min-width:0}
.bad{color:var(--warn)}
button{font:inherit;color:inherit;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:10px 12px;min-height:44px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button:disabled{opacity:.45}
.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.full{width:100%}
.ghost{flex:none;white-space:nowrap;min-height:34px;padding:4px 10px;border-radius:99px;font-size:13px;color:var(--mu)}
/* ---- thanh trên dính: ngày + việc đang làm ---- */
#top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--bd);padding:max(6px,env(safe-area-inset-top)) 12px 8px}
#top>div{max-width:640px;margin:0 auto}
.hd{display:flex;align-items:center;gap:8px}
.hd .ib{width:44px;padding:0;font-size:15px}
.hc{flex:1;text-align:center;line-height:1.2;cursor:pointer}
.hc b{font-size:17px}
.hc small{display:block}
.now{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 10px;border-radius:14px;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--c,var(--bd))}
.now .nm{flex:1;min-width:0;line-height:1.2}
.now .nm b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .nm small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .tm{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.now .stop{min-width:48px;padding:0;font-size:18px;border-color:var(--warn);color:var(--warn)}
.now.idle{border-left-color:var(--bd)}
.now.idle .nm b{color:var(--mu);font-weight:600}
.sub{margin-top:8px}
.banner{background:#f59e0b;color:#000;border-radius:12px;padding:8px 10px;text-align:center;margin-top:8px;font-size:14px}
.banner a{color:#000;font-weight:700}
/* ---- lưới nút ---- */
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:540px){.grid{grid-template-columns:repeat(3,1fr)}}
.act{min-height:68px;padding:8px 10px;text-align:left;border-left:6px solid var(--c);display:flex;flex-direction:column;justify-content:center;gap:2px;line-height:1.2}
.act b{font-size:17px;font-weight:700}
.act small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px}
.act.on{background:var(--c);color:#fff;border-color:var(--c)}
.act.on small{color:#fff;opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:5px 12px;border-radius:99px;font-size:14px;min-height:36px}
.chip.on{background:var(--warn);color:#fff;border-color:var(--warn)}
.chip.sel{background:var(--pri);color:#fff;border-color:var(--pri)}
/* ---- thẻ ---- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.truck{margin-bottom:8px}
.truck .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.truck .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.log{display:flex;gap:10px;padding:0 4px;min-height:52px;border-bottom:1px solid var(--bd);align-items:center;cursor:pointer}
.log:last-child{border:0}
.log .t{font-variant-numeric:tabular-nums;white-space:nowrap}
.log .tr{min-width:104px}
.log .td{min-width:48px;text-align:right}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%}
details{margin-top:10px}
summary{cursor:pointer;color:var(--mu);padding:8px 2px;font-size:14px}
pre{white-space:pre-wrap;word-break:break-all;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:12px;max-height:300px;overflow:auto;margin:6px 0 0}
/* ---- thanh tab dưới ---- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
#nav button{border:0;border-radius:0;background:none;min-height:var(--nav);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.15;color:var(--mu);border-top:3px solid transparent}
#nav button.on{color:var(--pri);border-top-color:var(--pri)}
#nav i{font-style:normal;font-size:20px;position:relative}
#nav i em{position:absolute;top:-4px;right:-12px;background:var(--warn);color:#fff;font-style:normal;font-size:11px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
#nav b{font-size:13px}
#nav small{font-size:10.5px}
/* ---- hộp thoại dạng tờ kéo từ dưới ---- */
dialog{border:0;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));margin:auto auto 0;width:100%;max-width:560px;max-height:calc(100dvh - 24px);background:var(--card);color:var(--tx);overflow:auto}
dialog[open]{animation:sheet .18s ease-out}
@keyframes sheet{from{transform:translateY(28px);opacity:.5}}
dialog::backdrop{background:#0009}
input,select{font:inherit;padding:10px;min-height:44px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);width:100%}
label{display:block;margin-top:12px;font-size:13px;color:var(--mu)}
.sq{width:38px;min-height:40px;padding:0;flex:none}
/* ô giờ: gõ số (0830 → 08:30) + nút ±5 phút, không dùng đồng hồ xoay */
.tf{display:flex;gap:6px;align-items:stretch}
.tf input{text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tf button{flex:none;min-width:52px;padding:0 6px;font-size:14px}
.tb{display:flex;gap:6px;align-items:stretch}
.tb .big{flex:1;min-height:60px;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tb .nud{flex:none;min-width:58px;font-size:15px}
.pill{white-space:nowrap;min-height:30px;padding:1px 10px;border-radius:99px;font-size:13px;color:var(--pri);border-color:var(--pri);background:transparent}
.now .nm .pr{margin-top:2px}
#bb{display:none;position:fixed;left:8px;right:8px;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom));z-index:40;background:var(--card);border:1px solid var(--pri);border-radius:16px;padding:10px;box-shadow:0 10px 30px #0007;max-width:624px;margin:0 auto}
#bb.on{display:block}
#bb .t{font-size:14px;line-height:1.3}
.pk{text-align:center}
.pk .hm{display:flex;justify-content:center;align-items:center;gap:2px;font-size:54px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.pk .hm span{padding:0 12px;border-radius:14px;cursor:pointer}
.pk .hm span.on{background:var(--pri);color:#fff}
.dial{touch-action:none;display:block;margin:8px auto;width:min(84vw,330px);height:min(84vw,330px)}
.pk .rel{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.pk .rel button{min-width:52px}
.pk .rel.fine{flex-wrap:nowrap}
.pk .rel.fine button{min-width:0;flex:1;padding:8px 0}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body>
<header id="top"></header>
<main id="app"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<div id="bb"></div>
<div id="toast" style="position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:pre-line;text-align:center;z-index:99;font-size:14px"></div>
<script>
const KEY='kholog.v1';
let ACTS=[
 {id:'recv',zh:'收货',vi:'Nhận hàng',c:'#2563eb',hide:1},
 {id:'coil',zh:'卸盘圆',vi:'Dỡ thép cuộn',c:'#7c3aed',hide:1},
 {id:'strap',zh:'卸铁带',vi:'Dỡ đai thép',c:'#0891b2',hide:1},
 {id:'tag',zh:'挂标识卡',vi:'Ghi thẻ nhận dạng (hậu nhận hàng)',c:'#2563eb'},
 {id:'issue',zh:'发料',vi:'Cấp phát',c:'#16a34a'},
 {id:'count',zh:'盘点',vi:'Kiểm kê',c:'#ca8a04'},
 {id:'sys',zh:'录入系统',vi:'Nhập hệ thống',c:'#64748b',hide:1},
 {id:'doc',zh:'入库单据/录入',vi:'Phiếu nhập kho · nhập hệ thống',c:'#0d9488'},
 {id:'rpt',zh:'做报告',vi:'Làm báo cáo',c:'#4f46e5'},
 {id:'tidy',zh:'整理货位',vi:'Sắp xếp kho',c:'#65a30d'},
 {id:'clean',zh:'5S清洁',vi:'Dọn dẹp vệ sinh',c:'#0ea5e9'},
 {id:'talk',zh:'沟通联系',vi:'Liên hệ/điện thoại',c:'#a855f7'},
 {id:'meet',zh:'开会',vi:'Họp',c:'#f43f5e'},
 {id:'walk',zh:'厂区步行',vi:'Đi bộ chuyển xưởng',c:'#d97706',hide:1},
 {id:'wfork',zh:'等叉车',vi:'Chờ xe nâng',c:'#dc2626',w:1,hide:1},
 {id:'wslot',zh:'等货位',vi:'Chờ vị trí kho',c:'#ea580c',w:1,hide:1},
 {id:'wman',zh:'等人手',vi:'Chờ nhân lực',c:'#e11d48',w:1,hide:1},
 {id:'wsup',zh:'等供应商',vi:'Chờ NCC',c:'#be123c',w:1,hide:1},
 {id:'scrap',zh:'称废料',vi:'Cân phế liệu',c:'#78716c'},
 {id:'rest',zh:'休息',vi:'Nghỉ',c:'#94a3b8'},
 {id:'other',zh:'其他',vi:'Khác',c:'#475569'}];
let A=Object.fromEntries(ACTS.map(a=>[a.id,a]));
const an=e=>e.act==='other'&&e.to?e.to:A[e.act].zh;
const anv=e=>e.act==='other'&&e.to?'':A[e.act].vi;
const akey=e=>e.act==='other'&&e.to?'o:'+e.to:e.act;
function actList(st){const o=ACTS.filter(a=>st.by[a.id]);Object.keys(st.by).filter(k=>k.startsWith('o:')).forEach(k=>o.push({id:k,zh:k.slice(2),vi:'',c:A.other.c}));return o}
const REASONS=[['货位满','Hết chỗ'],['缺人','Thiếu người'],['叉车忙','Xe nâng bận'],['四厂无码头','Xưởng 4 không bến'],['成品库出柜','Kho TP xuất cont'],['供应商集中到货','NCC giao dồn'],['过磅排队','Xếp hàng cân'],['其他','Khác']];
// [id, 中文, Việt, cần cân 2 chiều (hàng tính theo kg)]
let TYPES=[['coil','盘圆','Thép cuộn',1,'#7c3aed'],['strap','铁带','Đai thép',1,'#0891b2'],['chem','化学品','Hóa chất',1,'#db2777'],['powder','粉末','Bột sơn',1,'#ca8a04'],['recv','其他','Khác',0,'#475569']];
const ACTMAP={coil:'coil',strap:'strap'};
const PLACES=[['K1','K1'],['K2','K2'],['K3','K3'],['厂4','Xưởng 4'],['磅站','Trạm cân'],['办公室','Văn phòng']];
const STD=45;
let TC={};
const tyOf=t=>TYPES.find(x=>x[0]===t.type)||['','?','?',1];
const isW=t=>!!tyOf(t)[3];
const pl=p=>p[0]===p[1]?p[0]:p[0]+' '+p[1];
// giai đoạn tiếp theo của xe: win→start→unload→wout→fin→done
function stage(t){return t.done||t.end?'done':'out'}
const STEPS={out:['⚖ 出磅 Cân ra · 收货完成 Xong','var(--ok)'],win:['⚖ 进厂过磅 Cân vào','var(--pri)'],start:['▶ 开始卸 Bắt đầu dỡ','var(--pri)'],unload:['✔ 卸完 Dỡ xong','var(--ok)'],wout:['⚖ 出厂过磅 Cân ra','var(--pri)'],fin:['🏁 完成 Hoàn tất','var(--ok)']};
let S=load(), view=dk(Date.now());
function norm(o){o.days=o.days||{};o.sups=o.sups||[];o.dels=o.dels||[];o.idx=o.idx||{};o.cfg=o.cfg||{};return o}
function load(){try{return norm(JSON.parse(localStorage.getItem(KEY))||{})}catch(e){return norm({})}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function sig(r){const {u,pu,_s,...x}=r;return JSON.stringify(x)}
// save(): phát hiện bản ghi mới/sửa/xoá → đánh dấu u (thời điểm sửa) + hàng đợi xoá → đồng bộ
function save(){const now=Date.now(),seen={};
 for(const k in S.days)for(const [f,t] of [['log','logs'],['trucks','trucks']])for(const r of S.days[k][f]||[]){seen[r.id]=1;S.idx[r.id]=t;const g=sig(r);if(r._s!==g){r._s=g;r.u=Math.max(now,(r.u||0)+1)}}
 for(const id in S.idx)if(!seen[id]){if(!S.dels.some(d=>d.id===id))S.dels.push({id,t:S.idx[id]});delete S.idx[id]}
 persist();schedule(500)}
function dk(ms){const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function day(k=view){return S.days[k]||(S.days[k]={log:[],trucks:[]})}
const isToday=()=>view===dk(Date.now());
const uid=()=>Math.random().toString(36).slice(2,9);
const T=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const mins=(a,b)=>Math.max(0,Math.round((b-a)/60000));
const D=m=>m>=60?Math.floor(m/60)+'h'+String(m%60).padStart(2,'0'):m+"'";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toMs(k,hhmm){const [y,m,d]=k.split('-').map(Number),[h,mi]=hhmm.split(':').map(Number);return new Date(y,m-1,d,h,mi).getTime()}


// ---- nút tuỳ chỉnh (Công việc / Nhận hàng): lưu trong S.cfg, đi theo Backup
const sid=z=>'s'+[...z].map(c=>c.charCodeAt(0).toString(36)).join('');
function rebuild(){A=Object.fromEntries(ACTS.map(a=>[a.id,a]));TC={};TYPES.forEach(x=>TC[x[0]]=x[4]||'#475569');TC.recv=TC.recv||'#475569'}
function applyCfg(){const c=S.cfg||{};
 if(Array.isArray(c.acts)){const have=new Set(c.acts.map(a=>a.id));ACTS=c.acts.concat(ACTS.filter(a=>!have.has(a.id)))}
 if(Array.isArray(c.types)){const have=new Set(c.types.map(x=>x[0]));TYPES=c.types.concat(TYPES.filter(x=>!have.has(x[0])))}
 rebuild()}
function autoAct(z){if(!z||z==='其他')return A.other;let a=A[sid(z)];if(!a){a={id:sid(z),zh:z,vi:'',c:'#475569',hide:1};ACTS.push(a);S.cfg.acts=ACTS;rebuild()}return a}
function autoType(z){if(!z)return null;const id=sid(z);let x=TYPES.find(t=>t[0]===id);if(!x){x=[id,z,'',1,'#475569',1];TYPES.push(x);S.cfg.types=TYPES;rebuild()}return x}
applyCfg();
let CD=null,CK='';
function cfgDlg(k){CK=k;CD=k==='acts'?ACTS.map(a=>({id:a.id,zh:a.zh,vi:a.vi,c:a.c,w:a.w,hide:!!a.hide,hz:a.hide&&a.id!=='other'})):TYPES.map(x=>({id:x[0],zh:x[1],vi:x[2],w:x[3],c:x[4]||'#475569',hide:!!x[5]}));cfgDraw()}
function cfgDraw(){const k=CK,st=dlg.open?dlg.scrollTop:0;
 const h='<form onsubmit="cfgSave();return false"><b>✎ '+(k==='acts'?'工作 Nút Công việc':'收货 Nút Nhận hàng')+'</b><small class="mu"> ▲▼ đổi chỗ · ✕ ẩn · 👁 hiện lại</small><div>'+CD.map((it,i)=>'<div class="row" style="gap:5px;margin-top:8px;opacity:'+(it.hide?.45:1)+'"><input type="color" value="'+it.c+'" oninput="CD['+i+'].c=this.value" style="width:34px;padding:0;flex:none"><input value="'+esc(it.zh)+'" oninput="CD['+i+'].zh=this.value" placeholder="中文" style="width:26%;min-width:0"><input class="sp" value="'+esc(it.vi)+'" oninput="CD['+i+'].vi=this.value" placeholder="Tiếng Việt" style="min-width:0">'+(k==='types'?'<label title="Cân 2 chiều" style="flex:none"><input type="checkbox" '+(it.w?'checked':'')+' onchange="CD['+i+'].w=this.checked?1:0">⚖</label>':'')+'<button type="button" class="sq" onclick="cfgMv('+i+',-1)">▲</button><button type="button" class="sq" onclick="cfgMv('+i+',1)">▼</button>'+(it.id==='other'?'':'<button type="button" class="sq" onclick="CD['+i+'].hide=!CD['+i+'].hide;cfgDraw()">'+(it.hide?'👁':'✕')+'</button>')+'</div>').join('')+'</div><button type="button" style="width:100%;margin-top:10px" onclick="cfgAdd()">＋ Thêm nút mới</button><div class="row" style="margin-top:12px"><button type="button" class="sp" onclick="dlg.close()">取消</button><button class="sp pri">✔ 保存 Lưu</button></div></form>';
 if(dlg.open)dlg.innerHTML=h;else openDlg(h);dlg.scrollTop=st}
function cfgMv(i,d){const j=i+d;if(j<0||j>=CD.length)return;[CD[i],CD[j]]=[CD[j],CD[i]];cfgDraw()}
function cfgAdd(){CD.push({id:'c'+uid(),zh:'',vi:'',c:'#2563eb',w:1,hide:false,nw:1});cfgDraw();const l=dlg.querySelectorAll('input[placeholder="中文"]');l.length&&l[l.length-1].focus()}
function cfgSave(){const L=CD.filter(it=>!(it.nw&&!it.zh.trim()&&!it.vi.trim()));
 L.forEach(it=>{it.zh=it.zh.trim()||it.vi.trim();it.vi=it.vi.trim()});
 if(CK==='acts'){ACTS=L.map(it=>{const o={id:it.id,zh:it.zh,vi:it.vi,c:it.c};if(it.w)o.w=1;if(it.hide)o.hide=1;return o});S.cfg.acts=ACTS}
 else{TYPES=L.map(it=>[it.id,it.zh,it.vi,it.w?1:0,it.c,it.hide?1:0]);S.cfg.types=TYPES}
 rebuild();persist();dlg.close();render();toast('✔ 已保存 Đã lưu nút')}

// ---- actions
function closeActive(now=Date.now()){const l=day().log,a=l.find(e=>!e.end);if(a)a.end=now;return a}
function setTo(id,p){const e=day().log.find(x=>x.id===id);if(e){e.to=e.to===p?'':p;save();render()}}
function otherNames(){const c={};Object.values(S.days).forEach(d=>d.log.forEach(e=>{if(e.act==='other'&&e.to)c[e.to]=(c[e.to]||0)+1}));return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0])}

function stats(k){

 const walks=d.log.filter(e=>e.act==='walk'),wd={};walks.forEach(e=>{if(e.to)wd[e.to]=(wd[e.to]||0)+1});
 const walk={n:walks.length,m:by.walk||0,dest:wd};
 return {by,tot,wait,walk,trucks:d.trucks.map(t=>{const w=isW(t),first=w?(t.win||t.start):t.start,fin=t.done||(!w&&t.end)||now;
  return {...t,w:mins(t.arrive,first||now),dock:w&&t.win?mins(t.win,t.start||now):0,u:t.start?mins(t.start,t.end||now):0,out:w&&t.end?mins(t.end,t.wout||t.done||now):0,tot:mins(t.arrive,fin)}})}
}

// ---- ô giờ gõ số (thay đồng hồ xoay của Android): "0830" → 08:30, nút −5/+5/Bây giờ
function tf(id,v,clear){return `<div class="tb"><button type="button" class="nud" onclick="tfAdj('${id}',-5)">−5'</button><button type="button" class="big" id="${id}b" onclick="pickFor('${id}',${clear?1:0})">${v||'--:--'}</button><button type="button" class="nud" onclick="tfAdj('${id}',5)">+5'</button><input type="hidden" id="${id}" value="${v||''}"></div>`}
function tfFmt(el){const d=el.value.replace(/\D/g,'').slice(0,4);el.value=d.length>2?d.slice(0,2)+':'+d.slice(2):d}
function tfParse(s){const d=String(s||'').replace(/\D/g,'');if(!d)return null;let h,m;if(d.length<=2){h=+d;m=0}else{h=+d.slice(0,d.length-2);m=+d.slice(-2)}return h>23||m>59?null:h*60+m}
function tfSet(el,min){el.value=String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');const b=document.getElementById(el.id+'b');if(b)b.textContent=el.value}
function tfNorm(el){const m=tfParse(el.value);if(m==null){el.value='';const b=document.getElementById(el.id+'b');if(b)b.textContent='--:--'}else tfSet(el,m)}
function tfVal(id){const el=document.getElementById(id);if(!el)return '';tfNorm(el);return el.value}
function tfAdj(id,dm){const el=document.getElementById(id);let m=tfParse(el.value);if(m==null){const n=new Date();m=n.getHours()*60+n.getMinutes()}tfSet(el,((m+dm)%1440+1440)%1440)}
function tfNow(id){const n=new Date();tfSet(document.getElementById(id),n.getHours()*60+n.getMinutes())}

// ---- chỉnh giờ: (1) thanh "thực ra lúc mấy giờ?" ngay sau khi đổi/dừng việc  (2) đồng hồ quay TO, chạm là chọn  (3) sửa giờ thì việc kề bên tự dời cho khớp
const dlg2=document.getElementById('dlg2');
let PK=null,BB=null,bbTm=0;
const BBN=[5,10,15,30,60];
const pkP=n=>String(n).padStart(2,'0');
const dayStartMs=()=>toMs(view,'00:00');
// việc liền trước (kết thúc đúng lúc việc này bắt đầu) / liền sau (bắt đầu đúng lúc việc này kết thúc)
function neighbors(e){const L=day().log;return {prev:L.find(x=>x!==e&&x.end&&Math.abs(x.end-e.start)<2000),next:e.end?L.find(x=>x!==e&&Math.abs(x.start-e.end)<2000):null}}
function lowerBound(e,prev){if(prev)return prev.start;const ends=day().log.filter(x=>x!==e&&x.end&&x.end<=e.start).map(x=>x.end);return ends.length?Math.max(...ends):dayStartMs()}
// --- thanh lùi giờ (hiện ~20s sau khi bắt đầu/dừng): chạm "15' trước" là xong, việc trước tự khớp
function bbStart(id,prevId){BB={kind:'start',id,prevId};bbDraw();bbArm()}
function bbStop(id){BB={kind:'stop',id};bbDraw();bbArm()}
function bbArm(){clearTimeout(bbTm);bbTm=setTimeout(bbHide,20000)}
function bbHide(){BB=null;clearTimeout(bbTm);const el=document.getElementById('bb');if(el)el.className=''}
function bbCur(){return BB&&day().log.find(x=>x.id===BB.id)}
function bbDraw(){const el=document.getElementById('bb'),e=bbCur();if(!e){bbHide();return}
 const prev=BB.kind==='start'?day().log.find(x=>x.id===BB.prevId):null,cur=BB.kind==='start'?e.start:e.end,lo=BB.kind==='start'?lowerBound(e,prev):e.start;
 const chips=BBN.map(n=>{const ok=cur-n*60000>=lo;return `<button class="chip" ${ok?'':'disabled'} onclick="bbMove(${n})">${n<60?n+"'":'1h'} trước</button>`}).join('');
 el.innerHTML=`<div class="row"><div class="sp t">${BB.kind==='start'?'▶ <b>'+esc(an(e))+'</b> bắt đầu':'⏹ <b>Đã dừng</b>'} lúc <b>${T(cur)}</b><br><span class="mu">Thực ra là lúc mấy giờ? Chạm để lùi giờ:</span></div><button class="ghost sq" onclick="bbHide()" aria-label="close">✕</button></div><div class="chips">${chips}<button class="chip pri" onclick="bbPick()">🕒 Chọn giờ…</button></div>`;
 el.className='on'}
function bbSet(ms){const e=bbCur();if(!e)return;const L=day().log,now=Date.now();
 if(BB.kind==='start'){const prev=L.find(x=>x.id===BB.prevId),lo=lowerBound(e,prev);ms=Math.max(lo,Math.min(ms,now));e.start=ms;if(prev)prev.end=ms}
 else{ms=Math.max(e.start,Math.min(ms,now));e.end=ms}
 save();render();bbDraw();bbArm()}
function bbMove(n){const e=bbCur();if(e)bbSet((BB.kind==='start'?e.start:e.end)-n*60000)}
function bbPick(){const e=bbCur();if(!e)return;clearTimeout(bbTm);
 openPicker({title:BB.kind==='start'?'Việc này thực sự bắt đầu lúc?':'Việc này thực sự dừng lúc?',value:T(BB.kind==='start'?e.start:e.end),ok:v=>bbSet(toMs(view,v))})}
// --- chỉnh giờ bắt đầu của việc đang chạy (chạm vào "从 hh:mm ✎" trên thẻ đang làm)
function fixStart(id){const e=day().log.find(x=>x.id===id);if(!e)return;
 openPicker({title:'Việc này thực sự bắt đầu lúc?',value:T(e.start),ok:v=>{const nb=neighbors(e),lo=nb.prev?nb.prev.start:dayStartMs();const ms=Math.max(lo,Math.min(toMs(view,v),e.end||Date.now()));e.start=ms;if(nb.prev)nb.prev.end=ms;save();render()}})}
// --- đồng hồ quay: vòng ngoài 1–12, vòng trong 13–00 (như đồng hồ Android), chạm giờ rồi chạm phút; ±1'/±5'/±1h; "X phút trước"
function pickFor(id,clear){const el=document.getElementById(id),lb=el.parentElement.previousElementSibling;
 openPicker({title:lb?lb.textContent.trim():'Chọn giờ',value:el.value,clear:!!clear,ok:v=>{el.value=v;tfNorm(el)},clr:()=>{el.value='';tfNorm(el)}})}
function openPicker(o){const m=tfParse(o.value),n=new Date();PK={t:m==null?n.getHours()*60+n.getMinutes():m,mode:'h',o,drag:0};pkDraw();dlg2.showModal()}
function pkPt(r,i){const a=i*Math.PI/6;return [Math.round(r*Math.sin(a)*10)/10,Math.round(-r*Math.cos(a)*10)/10]}
function pkSvg(){const h=Math.floor(PK.t/60),m=PK.t%60,inH=h===0||h>12;let sel,s='';
 sel=PK.mode==='h'?pkPt(inH?72:114,h%12):pkPt(114,m/5);
 s+=`<circle r="148" style="fill:var(--bg)"/><line x1="0" y1="0" x2="${sel[0]}" y2="${sel[1]}" style="stroke:var(--pri);stroke-width:3"/><circle r="5" style="fill:var(--pri)"/><circle cx="${sel[0]}" cy="${sel[1]}" r="${PK.mode==='h'&&inH?21:27}" style="fill:var(--pri)"/>`;
 const tx=(p,v,fs,on)=>`<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="central" font-size="${fs}" font-weight="700" style="fill:${on?'#fff':'var(--tx)'};pointer-events:none">${v}</text>`;
 if(PK.mode==='h')for(let i=0;i<12;i++){const ov=i===0?12:i,iv=i===0?0:i+12;s+=tx(pkPt(114,i),ov,22,h===ov)+tx(pkPt(72,i),pkP(iv),17,h===iv)}
 else for(let i=0;i<12;i++)s+=tx(pkPt(114,i),pkP(i*5),22,m===i*5);
 return s}
function pkUpd(){const h=Math.floor(PK.t/60),m=PK.t%60,H=document.getElementById('pkh'),M=document.getElementById('pkm');
 H.textContent=pkP(h);M.textContent=pkP(m);H.className=PK.mode==='h'?'on':'';M.className=PK.mode==='m'?'on':'';
 document.getElementById('dial').innerHTML=pkSvg()}
function pkDraw(){const o=PK.o;
 dlg2.innerHTML=`<div class="pk"><b>${esc(o.title)}</b><div class="hm"><span id="pkh" onclick="pkMode('h')"></span>:<span id="pkm" onclick="pkMode('m')"></span></div>
 <svg id="dial" class="dial" viewBox="-150 -150 300 300" onpointerdown="pkDown(event)" onpointermove="pkMove(event)" onpointerup="pkUp(event)" onpointercancel="pkUp(event)"></svg>
 <div class="rel fine">${[['−1h',-60],['−5\'',-5],['−1\'',-1],['+1\'',1],['+5\'',5],['+1h',60]].map(x=>`<button type="button" onclick="pkAdj(${x[1]})">${x[0]}</button>`).join('')}</div>
 <div class="rel"><button type="button" class="chip" onclick="pkRel(0)">现在 Bây giờ</button>${[5,10,15,20,30,45,60].map(n=>`<button type="button" class="chip" onclick="pkRel(${n})">${n<60?n+"'":'1h'} trước</button>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button type="button" class="sp" onclick="dlg2.close()">取消 Huỷ</button>${o.clear?'<button type="button" class="sp" onclick="pkClr()">Xoá giờ</button>':''}<button type="button" class="sp pri" style="min-height:54px;font-size:18px" onclick="pkOk()">✔ OK</button></div></div>`;

function pkMode(m){PK.mode=m;pkUpd()}
function pkAdj(d){PK.t=((PK.t+d)%1440+1440)%1440;pkUpd()}
function pkRel(n){const d=new Date();PK.t=((d.getHours()*60+d.getMinutes()-n)%1440+1440)%1440;pkUpd()}
function pkHit(e){const r=e.currentTarget.getBoundingClientRect(),k=300/r.width,dx=(e.clientX-r.left-r.width/2)*k,dy=(e.clientY-r.top-r.height/2)*k,rad=Math.hypot(dx,dy);let a=Math.atan2(dx,-dy)*180/Math.PI;if(a<0)a+=360;
 const i=Math.round(a/30)%12;
 if(PK.mode==='h'){const h=rad<93?(i===0?0:i+12):(i===0?12:i);PK.t=h*60+PK.t%60}else PK.t=Math.floor(PK.t/60)*60+i*5;
 pkUpd()}
function pkDown(e){e.preventDefault();try{e.currentTarget.setPointerCapture(e.pointerId)}catch(x){}PK.drag=1;pkHit(e)}
function pkMove(e){if(PK.drag)pkHit(e)}

function report(k=view){
 const d=day(k),st=stats(k),now=Date.now(),L=[];
 L.push(`${k} 资材课 工作记录`,'','【时间段】');
 d.log.forEach(e=>L.push(`${T(e.start)}-${e.end?T(e.end):'进行中'} ${an(e)}${e.act!=='other'&&e.to?'→'+e.to:''} ${D(mins(e.start,e.end||now))}`));
 L.push('','【汇总】',`合计 ${D(st.tot)}：净工作 ${D(Math.max(0,st.tot-st.wait-st.walk.m-(st.by.rest||0)))}，等待/中断 ${D(st.wait)} (${st.tot?Math.round(st.wait*100/st.tot):0}%)，厂区步行 ${D(st.walk.m)} (${st.tot?Math.round(st.walk.m*100/st.tot):0}%)${st.by.rest?'，休息 '+D(st.by.rest):''}`);
 actList(st).forEach(a=>L.push(`${a.zh}: ${D(st.by[a.id])} (${Math.round(st.by[a.id]*100/st.tot)}%)`));
 if(st.walk.n)L.push(`厂区步行: 共${st.walk.n}趟，合计${D(st.walk.m)}，平均${Math.round(st.walk.m/st.walk.n)}分/趟`+(Object.keys(st.walk.dest).length?'，去向: '+Object.entries(st.walk.dest).map(([k,v])=>k+'×'+v).join(' '):''));
 if(st.trucks.length){L.push('','【收货记录】(盘圆标准 '+STD+' 分钟)');
  st.trucks.forEach(t=>L.push(trLine(t)));
  const wt=st.trucks.filter(t=>isW(t)&&!t.m);if(wt.length)L.push(`过磅车辆${wt.length}辆: 平均等进磅${Math.round(wt.reduce((s,t)=>s+t.w,0)/wt.length)}分，平均等出磅${Math.round(wt.reduce((s,t)=>s+t.out,0)/wt.length)}分`)}
 return L.join('\n')}
function copyRep(){const t=report();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('已复制 Đã copy')).catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('rep'));getSelection().removeAllRanges();getSelection().addRange(r);alert('Hãy giữ chọn & copy thủ công')})}
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
let xlsxTry=0;
function xlsx(){
 if(typeof XLSX==='undefined'&&!xlsxTry){xlsxTry=1;toast('Đang tải Excel…');const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=xlsx;s.onerror=xlsx;document.head.appendChild(s);return}
 const now=Date.now(),hm=x=>x?T(x):'',logs=[['日期','开始','结束','分钟','工作','Việc','去向']],walks=[['日期','开始','结束','分钟','去向']],trs=[['日期','供应商','货物','按kg过磅','到厂','进厂过磅','开始卸','卸完','出厂过磅','完成','等进磅(分)','入场(分)','卸货(分)','等出磅(分)','合计(分)','标准(分)','原因']],sum=[['日期','工作','Việc','分钟','等待?']];
 Object.keys(S.days).sort().forEach(k=>{const d=S.days[k],st=stats(k);
  d.log.forEach(e=>{const m=mins(e.start,e.end||now);logs.push([k,T(e.start),e.end?T(e.end):'',m,an(e),anv(e),e.act==='other'?'':(e.to||'')]);if(e.act==='walk')walks.push([k,T(e.start),e.end?T(e.end):'',m,e.to||''])});
  st.trucks.forEach(t=>trs.push([k,tname(t)+(t.sup&&t.sup!=="?"?" "+t.sup:""),tyOf(t)[1],isW(t)?'是':'',T(t.arrive),hm(t.win),hm(t.start),hm(t.end),hm(t.wout),hm(t.done),t.w,isW(t)?t.dock:'',t.u,isW(t)?t.out:'',t.tot,t.type==='coil'?STD:'',t.reasons.join('、')]));
  actList(st).forEach(a=>sum.push([k,a.zh,a.vi,st.by[a.id],a.w?'是':'']))});
 if(typeof XLSX==='undefined'){const csv=logs.map(r=>r.join(',')).join('\n');return dl('kho-log.csv',new Blob(['﻿'+csv],{type:'text/csv'}))}
 const wb=XLSX.utils.book_new();[['明细 Log',logs],['卸货过磅 Xe',trs],['步行 Di bo',walks],['汇总 Tong',sum]].forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n));
 XLSX.writeFile(wb,'kho-log-'+view+'.xlsx')}
function exportJson(){dl('kho-log-backup-'+view+'.json',new Blob([JSON.stringify(S)],{type:'application/json'}))}
function importDlg(){openDlg(`<b>还原 Restore</b><label>Chọn file backup .json</label><input type="file" accept=".json" onchange="doImport(this.files[0])"><div class="row" style="margin-top:14px"><button class="sp" onclick="dlg.close()">取消</button></div>`)}
function doImport(f){if(!f)return;f.text().then(t=>{const o=JSON.parse(t);if(!o.days)throw 0;if(!confirm('Ghi đè dữ liệu hiện tại?'))return;S=norm(o);save();dlg.close();render()}).catch(()=>alert('File không hợp lệ'))}
// ---- đồng bộ Google Sheet (chỉ hoạt động khi chạy trong Apps Script web app; mở file thường = chỉ lưu máy)
const API=(()=>{try{const m=location.hash.match(/u=([^&]+)/);if(m){localStorage.setItem('kholog.api',decodeURIComponent(m[1]));history.replaceState(null,'',location.pathname+location.search)}return localStorage.getItem('kholog.api')||''}catch(e){return ''}})();
const IN_GAS=typeof google!=='undefined'&&google.script&&google.script.run;
const GS=!!(IN_GAS||API);
function rpc(p){
 if(IN_GAS)return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no).sync(p));
 return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).then(r=>r.json()).then(j=>{if(j&&j.error)throw new Error(j.error);return j})}
function setApi(){const u=prompt('Dán link Web App (…/exec) của Apps Script:',API||'');if(u&&/^https:\/\/script\.google\.com\//.test(u.trim())){localStorage.setItem('kholog.api',u.trim());location.reload()}}
const KIND=[['log','logs'],['trucks','trucks']];
let busy=false,again=false,tm0,lastOk=0,errN=0,errMsg='';
const hm=x=>x?T(x):'';
const tm=(k,v)=>{const m=String(v==null?'':v).match(/(\d{1,2}):(\d{2})/);return m?toMs(k,m[1].padStart(2,'0')+':'+m[2]):null};
function toRow(f,k,r){
 if(f==='log')return [r.id,k,hm(r.start),hm(r.end),(A[r.act]||A.other).zh,r.to||'',r.truck||'',r.u];
 return [r.id,k,String(r.n||r.no||''),r.sup&&r.sup!=='?'?r.sup:'',(TYPES.find(x=>x[0]===r.type)||['',''])[1],hm(r.arrive),hm(r.win),hm(r.start),hm(r.end),hm(r.wout),hm(r.done),(r.reasons||[]).join('、'),r.u]}
function fromRow(f,row,k){
 const id=String(row[0]),u=+row[f==='log'?7:12]||0;
 if(f==='log'){const s=tm(k,row[2]);if(!s)return null;return {id,act:(ACTS.find(a=>a.zh===String(row[4]).trim())||(String(row[4]).trim()==='入库单据'?A.doc:autoAct(String(row[4]).trim()))).id,start:s,end:tm(k,row[3]),to:String(row[5]||''),...(row[6]?{truck:String(row[6])}:{}),u}}
 const ar=tm(k,row[5])||tm(k,row[7]);if(!ar)return null;
 const wi=tm(k,row[6]),stt=tm(k,row[7]);return {id,no:+row[2]||0,n:+row[2]||0,m:(wi&&stt&&wi!==stt)?0:1,sup:String(row[3]||''),type:(TYPES.find(x=>x[1]===String(row[4]).trim())||autoType(String(row[4]).trim())||[])[0]||null,arrive:ar,win:tm(k,row[6]),start:tm(k,row[7]),end:tm(k,row[8]),wout:tm(k,row[9]),done:tm(k,row[10]),reasons:row[11]?String(row[11]).split(/[、,，]/).map(s=>s.trim()).filter(Boolean):[],u}}
function pending(){let n=S.dels.length;for(const k in S.days)for(const [f] of KIND)for(const r of S.days[k][f]||[])if(r.u>(r.pu||0))n++;return n}
function setSt(){const e=document.getElementById('st');if(!e)return;
 e.onclick=(!IN_GAS&&/^https?:/.test(location.protocol))?setApi:null;
 e.textContent=!GS?(/^https?:/.test(location.protocol)?'⚙ Chạm để nhập link đồng bộ':'仅本机 · chỉ lưu máy'):errN?'⚠ 离线 Mất mạng — đã lưu máy ('+pending()+' chờ)':busy?'⟳ 同步中…':pending()?'● '+pending()+' 待同步':'✓ 已同步 '+(lastOk?T(lastOk):'')}
function schedule(ms){if(!GS)return;clearTimeout(tm0);tm0=setTimeout(doSync,ms==null?500:ms)}
function softRender(){const a=document.activeElement;if(!dlg.open&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render()}
function findRec(id){for(const k in S.days)for(const [f] of KIND){const i=(S.days[k][f]||[]).findIndex(x=>x.id===id);if(i>=0)return {k,f,i}}return null}
function ack(sent){const m=new Map(sent.rows.map(x=>[x.id,x.u]));
 for(const k in S.days)for(const [f] of KIND)for(const r of S.days[k][f]||[])if(m.has(r.id))r.pu=Math.max(r.pu||0,m.get(r.id));
 S.dels=S.dels.filter(d=>!sent.dels.some(s=>s.id===d.id))}
function merge(res){let ch=false;const sv={};
 KIND.forEach(([f,t])=>(res[t]||[]).forEach(row=>{const id=String(row[0]);sv[id]=1;const k=String(row[1]||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||S.dels.some(d=>d.id===id))return;
  const rec=fromRow(f,row,k);if(!rec)return;const at=findRec(id);
  if(!at||(rec.u>(S.days[at.k][at.f][at.i].u||0))){
   if(at)S.days[at.k][at.f].splice(at.i,1);
   rec.pu=rec.u;rec._s=sig(rec);day(k)[f].push(rec);S.idx[id]=t;ch=true}}));
 for(const k in S.days)for(const [f] of KIND){const a=S.days[k][f]||[];
  for(let i=a.length-1;i>=0;i--)if((a[i].pu||0)>0&&!sv[a[i].id]){delete S.idx[a[i].id];a.splice(i,1);ch=true}}   // xoá trong Sheet → xoá ở app
 for(const k in S.days){S.days[k].log.sort((a,b)=>a.start-b.start);S.days[k].trucks.sort((a,b)=>a.arrive-b.arrive)}
 return ch}
function doSync(){
 if(!GS)return;if(busy){again=true;return}
 busy=true;
 const p={logs:[],trucks:[],dels:S.dels.slice()},sent={rows:[],dels:p.dels};
 for(const k in S.days)for(const [f,t] of KIND)for(const r of S.days[k][f]||[])if(r.u>(r.pu||0)){p[t].push(toRow(f,k,r));sent.rows.push({id:r.id,u:r.u})}
 setSt();
 rpc(p).then(res=>{busy=false;errN=0;
  try{ack(sent);const ch=merge(res);persist();lastOk=Date.now();setSt();if(ch)softRender()}catch(e){errN++;errMsg=String(e);setSt()}
  if(again){again=false;schedule(100)}},
 err=>{busy=false;errN++;errMsg=String(err&&err.message||err);setSt();schedule(Math.min(30000,3000*errN))})}
setInterval(()=>{if(!document.hidden)schedule(0)},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule(0)});
window.addEventListener('online',()=>schedule(0));
schedule(0);
render();
</script>

navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){swRl();r.update().catch(function(){})}})}).catch(function(){});
navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadSW){want=1;swRl()}});}</script>
